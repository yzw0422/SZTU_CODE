[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sztu-agent"
version = "0.2.0"
description = "SZTU Code Agent"
requires-python = ">=3.10"
dependencies = [
    "pyfiglet",
    "openai",
]

[project.scripts]
sztu-code = "sztu_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]